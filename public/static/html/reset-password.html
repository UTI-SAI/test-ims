<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        a.button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Password Reset Request</h1>
        <p>Dear User,</p>
        <p>We received a request to reset your password. If you did not make this request, you can safely ignore this
            email.</p>
        <p>Otherwise, please click the button below to reset your password:</p>
        <a href="YOUR_RESET_PASSWORD_LINK" class="button">Reset Password</a>
        <p>Best regards,</p>
        <p>Billing Monitoring</p>
    </div>

</body>

</html>
