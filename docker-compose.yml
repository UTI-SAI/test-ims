version: "3.8"
services:
  redis:
    image: redis:latest
    container_name: redis-persistent
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command:
      [
        "redis-server",
        "--save",
        "900 1",
        "--save",
        "300 10",
        "--save",
        "60 10000",
      ]
    restart: always

volumes:
  redis_data:
